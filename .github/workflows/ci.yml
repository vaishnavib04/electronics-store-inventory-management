name: ESIMS CI/CD Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/esims_test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: esims_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Initialize MySQL test schema
        run: |
          python - <<'PY'
          from app import create_app
          from app.extensions import db

          app = create_app()
          with app.app_context():
              db.create_all()
          PY

      - name: Run backend tests and collect reports
        run: |
          mkdir -p reports
          python -m pytest -v \
            --junitxml=reports/backend-junit.xml \
            --cov=app \
            --cov-report=xml:reports/backend-coverage.xml \
            --cov-report=html:reports/backend-coverage-html

      - name: Publish backend test summary
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ElementTree
          from pathlib import Path

          report_path = Path("reports/backend-junit.xml")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])

          if report_path.exists():
              root = ElementTree.parse(report_path).getroot()
              suites = root.findall(".//testsuite")
              total = sum(int(suite.attrib.get("tests", 0)) for suite in suites)
              failures = sum(int(suite.attrib.get("failures", 0)) for suite in suites)
              errors = sum(int(suite.attrib.get("errors", 0)) for suite in suites)
              skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
              passed = total - failures - errors - skipped
          else:
              total = passed = failures = errors = skipped = "unavailable"

          coverage_path = Path("reports/backend-coverage.xml")
          coverage = "unavailable"
          if coverage_path.exists():
              coverage_root = ElementTree.parse(coverage_path).getroot()
              coverage = f"{float(coverage_root.attrib['line-rate']) * 100:.2f}%"

          summary_path.write_text(
              "## Backend test report\n\n"
              f"| Metric | Result |\n|---|---:|\n"
              f"| Total tests | {total} |\n"
              f"| Passed | {passed} |\n"
              f"| Failed | {failures} |\n"
              f"| Errors | {errors} |\n"
              f"| Skipped | {skipped} |\n"
              f"| Line coverage | {coverage} |\n",
              encoding="utf-8",
          )
          PY

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: reports/
          if-no-files-found: warn

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install template dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate templates and stylesheets
        id: frontend_validation
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader, TemplateSyntaxError

          template_root = Path("app/templates")
          templates = list(template_root.rglob("*.html"))
          stylesheets = list(Path("app/static").rglob("*.css"))
          environment = Environment(loader=FileSystemLoader(template_root))

          if not templates:
              raise SystemExit("No frontend templates were found.")
          if not stylesheets:
              raise SystemExit("No frontend stylesheets were found.")

          for template in templates:
              try:
                  environment.parse(template.read_text(encoding="utf-8"))
              except TemplateSyntaxError as error:
                  raise SystemExit(f"Invalid template {template}: {error}") from error

          report = Path("frontend-test-report.md")
          report.write_text(
              "# Frontend Validation Report\n\n"
              f"- Jinja templates parsed: {len(templates)}\n"
              f"- CSS files checked for content: {len(stylesheets)}\n"
              "- Result: passed\n",
              encoding="utf-8",
          )
          PY

      - name: Publish frontend test summary
        if: always()
        run: |
          {
            echo "## Frontend validation"
            echo "- Jinja templates and CSS validation: ${{ steps.frontend_validation.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload frontend report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: frontend-test-report.md
          if-no-files-found: warn

  quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip

      - name: Install project and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Run Ruff lint
        id: ruff_lint
        run: ruff check app tests

      - name: Check Ruff formatting
        id: ruff_format
        run: ruff format --check app tests

      - name: Publish quality summary
        if: always()
        run: |
          {
            echo "## Code quality"
            echo "- Ruff lint: ${{ steps.ruff_lint.outcome }}"
            echo "- Ruff formatting: ${{ steps.ruff_format.outcome }}"
            if [ "${{ steps.ruff_lint.outcome }}" = "success" ] && [ "${{ steps.ruff_format.outcome }}" = "success" ]; then
              echo "- Quality pass percentage: 100%"
            else
              echo "- Quality pass percentage: 0%"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-audit:
    name: Security checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip

      - name: Install dependencies and pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit

      - name: Audit Python dependencies
        id: dependency_audit
        run: python -m pip_audit -r requirements.txt

      - name: Publish security summary
        if: always()
        run: |
          {
            echo "## Security checks"
            echo "- pip-audit: ${{ steps.dependency_audit.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  reports:
    name: Collect test reports
    if: always()
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest

    steps:
      - name: Download backend reports
        uses: actions/download-artifact@v4
        with:
          name: backend-test-reports
          path: reports/backend

      - name: Download frontend reports
        uses: actions/download-artifact@v4
        with:
          name: frontend-test-reports
          path: reports/frontend

      - name: Upload combined test reports
        uses: actions/upload-artifact@v4
        with:
          name: esims-test-reports
          path: reports/
          if-no-files-found: warn

  pipeline-summary:
    name: Pipeline summary
    if: always()
    needs:
      - backend
      - frontend
      - quality
      - dependency-audit
      - reports
    runs-on: ubuntu-latest

    steps:
      - name: Publish pipeline summary
        run: |
          {
            echo "## ESIMS CI/CD Pipeline"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Backend tests | ${{ needs.backend.result }} |"
            echo "| Frontend validation | ${{ needs.frontend.result }} |"
            echo "| Code quality | ${{ needs.quality.result }} |"
            echo "| Security checks | ${{ needs.dependency-audit.result }} |"
            echo "| Test reports | ${{ needs.reports.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
