{% extends "base.html" %}

{% block title %}Login | ESIMS{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-6 col-lg-5 login-panel">
    <div class="card overflow-hidden">
      <div class="login-brand">
        <div class="mb-2"><i class="bi bi-box-seam fs-2"></i></div>
        <h2 class="h3 mb-1">Welcome back</h2>
        <p class="mb-0 opacity-75">Sign in to manage your store.</p>
      </div>
      <div class="card-body p-4 p-md-5">

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else category }} message {{ category }}" role="alert">{{ message }}</div>
          {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" class="form-control"
                   maxlength="80" autocomplete="username" required
                   value="{{ request.form.get('username', '') if request.method == 'POST' else '' }}">
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control"
                   autocomplete="current-password" required>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign in
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
