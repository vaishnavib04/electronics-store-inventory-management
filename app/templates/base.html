<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ESIMS{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <header class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{{ url_for('auth.dashboard') if current_user is defined and current_user.is_authenticated else url_for('auth.login') }}">
                <h1 class="h5 mb-0">Electronics Store Inventory Management System</h1>
            </a>
            {% if current_user is defined and current_user.is_authenticated %}
            <nav aria-label="Main navigation" class="navbar-nav d-flex flex-row flex-wrap gap-3 align-items-center">
                <a href="{{ url_for('auth.dashboard') }}" class="nav-link text-white">Dashboard</a>
                <a href="{{ url_for('products.list_products') }}" class="nav-link text-white">Products</a>
                <a href="{{ url_for('inventory.list_inventory') }}" class="nav-link text-white">Inventory</a>
                <a href="{{ url_for('inventory.low_stock_report') }}" class="nav-link text-white">Low Stock</a>
                <a href="{{ url_for('suppliers.list_suppliers') }}" class="nav-link text-white">Suppliers</a>
                <a href="{{ url_for('purchases.list_purchases') }}" class="nav-link text-white">Purchases</a>
                <a href="{{ url_for('sales.list_sales') }}" class="nav-link text-white">Sales</a>
                <a href="{{ url_for('reports.inventory_report') }}" class="nav-link text-white">Inventory Report</a>
                <a href="{{ url_for('reports.sales_report') }}" class="nav-link text-white">Sales Report</a>
            </nav>
            {% endif %}
        </div>
    </header>

    <main class="container pb-5">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
