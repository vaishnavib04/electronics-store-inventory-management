<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ESIMS{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <header class="navbar navbar-expand-lg navbar-dark esims-navbar mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand esims-brand fw-semibold" href="{{ url_for('auth.dashboard') if current_user is defined and current_user.is_authenticated else url_for('auth.login') }}">
                <h1 class="h5 mb-0"><i class="bi bi-box-seam me-2"></i>ESIMS</h1>
            </a>
            {% if current_user is defined and current_user.is_authenticated %}
            <nav aria-label="Main navigation" class="navbar-nav esims-nav d-flex flex-row flex-wrap gap-1 align-items-center">
                <a href="{{ url_for('auth.dashboard') }}" class="nav-link px-2">Dashboard</a>
                <a href="{{ url_for('products.list_products') }}" class="nav-link px-2">Products</a>
                <a href="{{ url_for('inventory.list_inventory') }}" class="nav-link px-2">Inventory</a>
                <a href="{{ url_for('inventory.low_stock_report') }}" class="nav-link px-2">Low Stock</a>
                <a href="{{ url_for('suppliers.list_suppliers') }}" class="nav-link px-2">Suppliers</a>
                <a href="{{ url_for('purchases.list_purchases') }}" class="nav-link px-2">Purchases</a>
                <a href="{{ url_for('sales.list_sales') }}" class="nav-link px-2">Sales</a>
                <a href="{{ url_for('reports.inventory_report') }}" class="nav-link px-2">Inventory Report</a>
                <a href="{{ url_for('reports.sales_report') }}" class="nav-link px-2">Sales Report</a>
            </nav>
            {% endif %}
        </div>
    </header>

    <main class="container pb-5">
        {% block content %}{% endblock %}
    </main>
    <footer class="container border-top py-4 text-center text-muted small">
        Electronics Store Inventory Management System
    </footer>
</body>
</html>
