<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ESIMS{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .message.success, .flash.success, li.success, p.success { color: #0f5132; background-color: #d1e7dd; border: 1px solid #badbcc; padding: 0.5rem 0.75rem; border-radius: 0.25rem; }
        .message.error, .flash.error, li.error, p.error { color: #842029; background-color: #f8d7da; border: 1px solid #f5c2c7; padding: 0.5rem 0.75rem; border-radius: 0.25rem; }
    </style>
</head>
<body class="bg-light">
    <header class="bg-dark text-white py-3 mb-4 shadow-sm">
        <div class="container d-flex flex-wrap justify-content-between align-items-center">
            <h1 class="h4 mb-0">Electronics Store Inventory Management System</h1>
            {% if current_user is defined and current_user.is_authenticated %}
            <nav aria-label="Main navigation" class="d-flex flex-wrap gap-3 align-items-center mt-2 mt-md-0">
                <a href="{{ url_for('auth.dashboard') }}" class="text-white text-decoration-none">Dashboard</a>
                <a href="{{ url_for('products.list_products') }}" class="text-white text-decoration-none">Products</a>
                <a href="{{ url_for('inventory.list_inventory') }}" class="text-white text-decoration-none">Inventory</a>
                <a href="{{ url_for('inventory.low_stock_report') }}" class="text-white text-decoration-none">Low Stock</a>
                <a href="{{ url_for('suppliers.list_suppliers') }}" class="text-white text-decoration-none">Suppliers</a>
                <a href="{{ url_for('purchases.list_purchases') }}" class="text-white text-decoration-none">Purchases</a>
                <a href="{{ url_for('sales.list_sales') }}" class="text-white text-decoration-none">Sales</a>
                <a href="{{ url_for('reports.inventory_report') }}" class="text-white text-decoration-none">Inventory Report</a>
                <a href="{{ url_for('reports.sales_report') }}" class="text-white text-decoration-none">Sales Report</a>
            </nav>
            {% endif %}
        </div>
    </header>

    <main class="container pb-5">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
