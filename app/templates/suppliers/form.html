
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ "Edit Supplier" if supplier else "Add Supplier" }}</title>
</head>
<body>
    <h1>{{ "Edit Supplier" if supplier else "Add Supplier" }}</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p class="{{ category }}">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST"
          action="{{ url_for('suppliers.edit_supplier', supplier_id=supplier.supplier_id) if supplier else url_for('suppliers.add_supplier') }}">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <p>
            <label for="name">Supplier Name *</label><br>
            <input
                type="text"
                id="name"
                name="name"
                maxlength="150"
                required
                value="{{ form_data.get('name', supplier.name if supplier else '') }}"
            >
        </p>

        <p>
            <label for="contact_person">Contact Person</label><br>
            <input
                type="text"
                id="contact_person"
                name="contact_person"
                maxlength="100"
                value="{{ form_data.get('contact_person', supplier.contact_person if supplier else '') }}"
            >
        </p>

        <p>
            <label for="phone">Phone Number</label><br>
            <input
                type="tel"
                id="phone"
                name="phone"
                maxlength="30"
                value="{{ form_data.get('phone', supplier.phone if supplier else '') }}"
            >
        </p>

        <p>
            <label for="email">Email Address</label><br>
            <input
                type="email"
                id="email"
                name="email"
                maxlength="150"
                value="{{ form_data.get('email', supplier.email if supplier else '') }}"
            >
        </p>

        <p>
            <label for="address">Address</label><br>
            <textarea id="address" name="address">{{ form_data.get('address', supplier.address if supplier else '') }}</textarea>
        </p>

        <button type="submit">
            {{ "Update Supplier" if supplier else "Save Supplier" }}
        </button>

        <a href="{{ url_for('suppliers.list_suppliers') }}">Cancel</a>
    </form>
</body>
</html>
